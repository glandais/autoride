name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the Flutter pin across the three jobs, so they cannot drift.
  # Keep in sync with the version used locally (CLAUDE.md).
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / riverpod / json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # The two build jobs are compile-only smoke tests: they exist so a broken release build is
  # caught here rather than in the middle of ./publish_beta.sh. Neither signs or uploads
  # anything, and neither consumes a secret — releasing stays local.
  build-android:
    name: Build Android (app bundle)
    # Gated on the cheap job: no point burning a Gradle build on code that fails analyze.
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # android/gradle.properties asks for -Xmx8G/-XX:MaxMetaspaceSize=4G, which is sized for a
      # dev laptop. The 16 GB runner also hosts the Kotlin and AGP workers, so cap the daemon
      # lower here. GRADLE_OPTS wins over gradle.properties for org.gradle.* system properties,
      # which keeps this override out of the checked-in file.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gradle 9.7.1 / AGP 9.3.2 are not validated against JDK 25, and the ubuntu-latest
      # default JDK moves with the runner image. Pin 21 — the same version publish_beta.sh
      # forces locally via JAVA_HOME.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # compileSdk is pinned to 37 in android/app/build.gradle.kts (permission_handler_android's
      # AAR metadata refuses lower). The runner image only preinstalls the last few stable
      # platforms, so install it explicitly instead of relying on AGP's auto-download.
      - name: Install Android SDK platform 37
        run: |
          # The runner image ships the command-line tools under a versioned directory inside
          # $ANDROID_HOME but does not put sdkmanager on PATH, so resolve it instead of
          # calling it bare (that failed with "sdkmanager: command not found").
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK not found on this runner}}"
          resolve_sdkmanager() {
            find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1
          }
          sdkmanager="$(resolve_sdkmanager)"
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under $sdk_root/cmdline-tools"
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          # The platform IDs now carry a minor version ("platforms;android-37.0", installed as
          # platforms/android-37.0); an sdkmanager older than that scheme cannot resolve them
          # ("Failed to find package"), so refresh cmdline-tools first and re-resolve the binary.
          "$sdkmanager" "cmdline-tools;latest"
          sdkmanager="$(resolve_sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / riverpod / json)
        run: dart run build_runner build --delete-conflicting-outputs

      # android/key.properties is absent in CI, so android/app/build.gradle.kts falls back to
      # the debug keystore. That is fine here: this job never uploads. Real releases go through
      # publish_beta.sh, which refuses to build when key.properties is missing.
      - name: Build app bundle (debug-signed, not for distribution)
        run: flutter build appbundle --release

  build-ios:
    name: Build iOS (unsigned)
    needs: [analyze-and-test]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / riverpod / json)
        run: dart run build_runner build --delete-conflicting-outputs

      # `flutter build ios` runs pod install itself; caching the resolved Pods and the spec repo
      # keeps it from re-downloading every pod each run. Keyed on the committed Podfile.lock, so
      # a pod bump invalidates the cache.
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # No signing assets in CI by design — this only proves the iOS target and every pod still
      # compile.
      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign
