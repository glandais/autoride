# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Dart / Flutter packages (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆️ chore(deps)"
    groups:
      # Batch low-risk minor/patch bumps into a single PR to cut noise.
      pub-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Android native build (Gradle, Kotlin DSL)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ chore(deps)"
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ chore(deps)"
    groups:
      actions-all:
        update-types:
          - "minor"
          - "patch"
