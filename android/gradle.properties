org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Some plugins (e.g. tflite_flutter) compile Java to target 11 while Kotlin
# defaults to the JDK's target; Kotlin 2.x treats that mismatch as an error.
# Downgrade the cross-task validation to a warning so plugin builds proceed.
kotlin.jvm.target.validation.mode=warning
# AGP provides the Kotlin compilation itself; the standalone Kotlin Gradle Plugin is no
# longer applied to :app. See migrate-to-built-in-kotlin/for-app-developers.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
