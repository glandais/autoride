name: autoride
description: "Automatic bike trip detection using motion sensors and ML-powered activity recognition"
publish_to: 'none'
# X.Y.Z is the user-visible marketing version, bumped by hand.
# +N is the build number: bumped by publish_beta.sh on every store upload, never reset.
# Single source of truth for both platforms (Android versionCode/Name, iOS CFBundleVersion).
version: 1.0.0+18

environment:
  sdk: ^3.13.0

dependencies:
  battery_plus: ^7.1.1           # Battery level monitoring for power optimization
  device_info_plus: ^13.2.0      # Platform info (Android API level, iOS version)
  fit_dart_sdk: ^21.215.0        # Garmin FIT encoding for trip export
  flutter:
    sdk: flutter
  flutter_background_service: ^5.0.0  # Background task execution
  flutter_local_notifications: ^22.3.0  # Local and foreground notifications
  flutter_map: ^8.3.2            # Map rendering with OpenStreetMap
  flutter_riverpod: ^3.4.3       # State management with code generation
  freezed_annotation: ^3.0.0     # Immutable models
  geolocator: ^14.0.2            # GPS location tracking
  json_annotation: ^4.12.0       # Annotations for JSON serialization codegen
  latlong2: ^0.10.1               # Coordinate handling for flutter_map
  package_info_plus: ^10.2.1     # App version/build number for the Settings About row
  path: ^1.9.0                   # Path manipulation for database paths
  path_provider: ^2.1.5          # Temp directory for exported .fit files
  permission_handler: ^13.0.2    # Runtime permission handling
  riverpod_annotation: ^4.0.6    # Riverpod annotations
  sensors_plus: ^7.1.0           # Accelerometer & gyroscope
  share_plus: ^13.3.0            # Share/save the exported .fit file via the OS sheet
  shared_preferences: ^2.2.0     # User settings storage
  sqflite: ^2.4.4                # SQLite database for trips
  url_launcher: ^6.3.2         # Open the hosted privacy policy / terms in the browser

dev_dependencies:
  # Code Generation
  build_runner: ^2.16.1           # Code generation tool

  # Assets
  flutter_launcher_icons: ^0.14.4  # App icon generation

  # Linting
  flutter_lints: ^6.0.0

  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

  freezed: ^4.0.1                # Freezed code generation
  json_serializable: ^6.14.1     # JSON serialization code generation

  # Testing seams for the audit-log export: the temporary directory is faked
  # (path_provider has no test double of its own) and faking a platform
  # interface requires its mixin.
  path_provider_platform_interface: ^2.1.3

  # Testing seam: the plugin's own platform interface, swapped for a fake in
  # PermissionHandlerService's tests (permission_handler does not re-export it).
  permission_handler_platform_interface: ^4.4.1

  plugin_platform_interface: ^2.1.8

  # Code Generation - Riverpod
  riverpod_generator: ^4.0.8     # Riverpod code generation

  # Testing
  sqflite_common_ffi: ^2.4.3     # SQLite testing on desktop platforms

flutter:
  uses-material-design: true

  # Roboto is bundled, not fetched. The app used `google_fonts`, whose
  # `allowRuntimeFetching` defaults to true: with no font in the assets it
  # downloaded Roboto from fonts.gstatic.com on first launch, disclosing the
  # user's IP address to Google — which the privacy policy says never happens.
  # Apache-2.0, copied from the Flutter SDK's material_fonts artifact; the
  # licence travels with the files in assets/fonts/LICENSE.txt.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
