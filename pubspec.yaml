name: autoride
description: "Automatic bike trip detection using motion sensors and ML-powered activity recognition"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.4

dependencies:
  battery_plus: ^7.1.1           # Battery level monitoring for power optimization
  device_info_plus: ^13.2.0      # Platform info (Android API level, iOS version)
  flutter:
    sdk: flutter
  flutter_background_service: ^5.0.0  # Background task execution
  flutter_local_notifications: ^22.1.0  # Local and foreground notifications
  flutter_map: ^8.3.1            # Map rendering with OpenStreetMap
  flutter_riverpod: ^3.3.2       # State management with code generation
  freezed_annotation: ^3.0.0     # Immutable models
  geolocator: ^14.0.2            # GPS location tracking
  google_fonts: ^8.2.0           # Typography with Google Fonts (Roboto)
  latlong2: ^0.10.1               # Coordinate handling for flutter_map
  path: ^1.9.0                   # Path manipulation for database paths
  permission_handler: ^12.0.1    # Runtime permission handling
  riverpod_annotation: ^4.0.3    # Riverpod annotations
  sensors_plus: ^7.1.0           # Accelerometer & gyroscope
  shared_preferences: ^2.2.0     # User settings storage
  sqflite: ^2.3.0                # SQLite database for trips
  tflite_flutter: ^0.12.1        # TensorFlow Lite for activity recognition
  wakelock_plus: ^1.3.3          # Keep device awake during tracking

dev_dependencies:
  # Code Generation
  build_runner: ^2.15.1           # Code generation tool

  # Assets
  flutter_launcher_icons: ^0.14.4  # App icon generation

  # Linting
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter

  freezed: ^3.2.6-dev.1                # Freezed code generation
  json_serializable: ^6.14.0     # JSON serialization code generation

  # Code Generation - Riverpod
  riverpod_generator: ^4.0.4     # Riverpod code generation

  # Testing
  sqflite_common_ffi: ^2.3.0     # SQLite testing on desktop platforms

flutter:
  uses-material-design: true
